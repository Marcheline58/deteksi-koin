<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Image Recognition (Upload)</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<style>
:root {
    --box: #ffffff;
    --text: #000;
}

body.dark {
    --box: #2f2f44;
    --text: #ffffff;
}

/* ===== CENTER + BACKGROUND ===== */
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Times New Roman", serif;
    color: var(--text);

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45) 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.45) 2px, transparent 3px),
        linear-gradient(#82BBBD, #A7DADB);
    background-size: 80px 80px, 100px 100px, cover;

    transition: 0.4s;
}

body.dark {
    background: linear-gradient(#1e1e2f, #2a2a40);
}

/* ===== EDITABLE NOTE BOX (BACKGROUND) ===== */
.note-box {
    position: fixed;
    top: 20px;
    right: 20px;
    max-width: 230px;
    min-height: 20px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.85);
    color: #000;
    border-radius: 12px;
    font-size: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    outline: none;
    cursor: text;
    z-index: 10;
}

body.dark .note-box {
    background: rgba(40, 40, 60, 0.9);
    color: #fff;
}

/* ===== CAT BOX ===== */
.cat-box {
    position: relative;
    background: var(--box);
    width: 420px;
    padding: 35px 20px 40px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
}

/* ===== DARK MODE BUTTON ===== */
.toggle {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
}

body.dark .toggle {
    background: rgba(255,255,255,0.15);
}

/* ===== EARS ===== */
.cat-box::before,
.cat-box::after {
    content: "";
    position: absolute;
    top: -30px;
    width: 60px;
    height: 60px;
    background: var(--box);
    border-radius: 10px;
    transform: rotate(45deg);
    animation: wiggle 4s infinite;
}

.cat-box::before { left: 45px; }
.cat-box::after { right: 45px; }

@keyframes wiggle {
    0%,100% { transform: rotate(45deg); }
    50% { transform: rotate(40deg); }
}

/* ===== TAIL ===== */
.tail {
    position: absolute;
    right: -40px;
    bottom: 40px;
    width: 60px;
    height: 20px;
    background: var(--box);
    border-radius: 20px;
    transform-origin: left center;
    animation: tail 2s infinite ease-in-out;
}

@keyframes tail {
    0% { transform: rotate(20deg); }
    50% { transform: rotate(-20deg); }
    100% { transform: rotate(20deg); }
}

/* ===== FACE ===== */
.eyes {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 6px;
}

.eye {
    width: 14px;
    height: 14px;
    background: #333;
    border-radius: 50%;
    animation: blink 5s infinite;
}

body.dark .eye {
    background: #fff;
}

@keyframes blink {
    0%, 95%, 100% { height: 14px; }
    97% { height: 2px; }
}

.blush {
    display: flex;
    justify-content: center;
    gap: 45px;
}

.cheek {
    width: 16px;
    height: 8px;
    background: #ffb6c1;
    border-radius: 50%;
    opacity: 0.6;
}

.nose {
    width: 12px;
    height: 8px;
    background: pink;
    border-radius: 50%;
    margin: 6px auto 14px;
}

/* ===== CONTENT ===== */
img {
    width: 100%;
    margin-top: 12px;
    border-radius: 12px;
}

#result {
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<!-- NOTE BOX DI BACKGROUND -->
<div class="note-box" contenteditable="true">
Made by Marcheline XII-4/14
</div>

<div class="cat-box">
    <div class="toggle" onclick="toggleDark()">🌙</div>
    <div class="tail"></div>

    <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
    </div>

    <div class="blush">
        <div class="cheek"></div>
        <div class="cheek"></div>
    </div>

    <div class="nose"></div>

    <h3>🐾 Image Recognition (deteksi koin 50 piastres dan 100 piastres)</h3>

    <input type="file" accept="image/*" onchange="predictImage(event)">
    <img id="preview">
    <div id="result"></div>
</div>

<script>
function toggleDark() {
    document.body.classList.toggle("dark");
}

const MODEL_URL = "https://teachablemachine.withgoogle.com/models/J8gT1inmM/";
let model;

async function loadModel() {
    model = await tmImage.load(
        MODEL_URL + "model.json",
        MODEL_URL + "metadata.json"
    );
}
loadModel();

async function predictImage(event) {
    if (!model) {
        alert("Model belum siap");
        return;
    }

    const img = document.getElementById("preview");
    img.src = URL.createObjectURL(event.target.files[0]);
    document.getElementById("result").innerHTML = "😺 Memprediksi...";

    img.onload = async () => {
        const predictions = await model.predict(img);
        const best = predictions.reduce((a, b) =>
            a.probability > b.probability ? a : b
        );

        document.getElementById("result").innerHTML =
            `${best.className}<br>${(best.probability * 100).toFixed(2)}%`;
    };
}
</script>

</body>
</html>
